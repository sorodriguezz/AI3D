name: release

# Al subir una versión nueva a main se crea su tag y se compila, firma y publica.
# La Release empieza como borrador; cada plataforma sube su instalador y su paquete de
# actualización. Solo cuando están las tres se publica, así releases/latest/download/latest.json
# (lo que lee el actualizador de la app) nunca apunta a una versión sin el sistema del usuario.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# One publication at a time; never cancel an installer build in progress.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test release automation
        run: python3 -m unittest discover -s scripts -p test_release.py -v
      - name: Validate version and create its tag
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATER_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: python3 scripts/prepare_release.py

  test:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install webkit
      - run: npm test

  create-release:
    needs: [prepare, test]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.draft.outputs.id }}
      tag: ${{ needs.prepare.outputs.tag }}
      sha: ${{ needs.prepare.outputs.sha }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      # El id sale directamente de la creación; listar releases justo después puede no encontrarla.
      - id: draft
        run: |
          existing=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq '.[] | select(.tag_name == env.TAG) | .id')
          if [ -n "$existing" ]; then
            echo "id=$existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          body=$(printf '%s\n' \
            "## Descargar AI3D $TAG" \
            "" \
            "| Sistema | Instalador |" \
            "| --- | --- |" \
            "| macOS (Apple Silicon: M1, M2, M3, M4) | [AI3D-macOS-AppleSilicon.dmg]($base/AI3D-macOS-AppleSilicon.dmg) |" \
            "| Windows (Intel / AMD, x64) | [AI3D-Windows-x64-setup.exe]($base/AI3D-Windows-x64-setup.exe) |" \
            "| Windows ARM (Snapdragon, ARM64) | [AI3D-Windows-ARM64-setup.exe]($base/AI3D-Windows-ARM64-setup.exe) |" \
            "" \
            "Si ya tienes AI3D, se actualiza sola desde la app." \
            "" \
            "**macOS:** la primera vez, permite la app en *Ajustes del Sistema → Privacidad y seguridad*. **Windows:** si aparece SmartScreen, pulsa *Más información → Ejecutar de todas formas*.")
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG" -f name="AI3D $TAG" \
            -F draft=true -f body="$body" --jq .id)
          [ -n "$id" ] || exit 1
          echo "id=$id" >> "$GITHUB_OUTPUT"

  publish:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Firma de las actualizaciones (ed25519), no firma de sistema operativo.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.target }}
          releaseId: ${{ needs.create-release.outputs.id }}
          includeUpdaterJson: true

      - name: Verify macOS app signature before publishing the release
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict --verbose=2 "src-tauri/target/${{ matrix.target }}/release/bundle/macos/AI3D.app"

  publish-release:
    needs: [create-release, publish]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.create-release.outputs.tag }}
      ID: ${{ needs.create-release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.sha }}
      # Un borrador no se puede buscar por etiqueta, así que todo va por su id.
      - name: Rebuild latest.json from the signed bundles
        run: |
          mkdir sigs
          gh api "repos/$GITHUB_REPOSITORY/releases/$ID/assets" --paginate \
            --jq '.[] | select(.name | endswith(".sig")) | "\(.id) \(.name)"' |
          while read -r aid name; do
            gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$aid" > "sigs/$name"
          done
          ls sigs
          python3 scripts/updater_manifest.py "$TAG" "$GITHUB_REPOSITORY" sigs
          old=$(gh api "repos/$GITHUB_REPOSITORY/releases/$ID/assets" --paginate --jq '.[] | select(.name == "latest.json") | .id')
          [ -z "$old" ] || gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"
          gh api -X POST -H "Content-Type: application/json" --input latest.json \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$ID/assets?name=latest.json" > /dev/null

      # Copias con nombre fijo: releases/latest/download/<nombre> siempre lleva a la última versión
      # de cada sistema, así el README y cualquier web pueden enlazar la descarga directa.
      - name: Upload installers with stable names
        run: |
          assets=$(gh api "repos/$GITHUB_REPOSITORY/releases/$ID/assets" --paginate --jq '.[] | "\(.id) \(.name)"')
          upload() {
            pattern="$1"; stable="$2"
            line=$(echo "$assets" | awk -v p="$pattern" '$2 ~ p {print; exit}')
            [ -n "$line" ] || { echo "falta un instalador que coincida con $pattern"; exit 1; }
            aid=${line%% *}
            gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$aid" > "$stable"
            old=$(gh api "repos/$GITHUB_REPOSITORY/releases/$ID/assets" --paginate \
              --jq '.[] | [.id, .name] | @tsv' | awk -v name="$stable" '$2 == name {print $1}')
            [ -z "$old" ] || gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"
            gh api -X POST -H "Content-Type: application/octet-stream" --input "$stable" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$ID/assets?name=$stable" > /dev/null
            echo "$stable <- ${line#* }"
          }
          upload '_aarch64\\.dmg$' AI3D-macOS-AppleSilicon.dmg
          upload '_x64-setup\\.exe$' AI3D-Windows-x64-setup.exe
          upload '_arm64-setup\\.exe$' AI3D-Windows-ARM64-setup.exe

      - name: Publish
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -F draft=false -f make_latest=true > /dev/null
